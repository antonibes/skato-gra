<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16171a" />
    <title>SKATO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <section id="menu-screen" class="menu-screen">
        <div class="menu-logo">
          <div class="logo-3d-board">
            <div class="board-3d-face">
              <div class="grid-3d-cell">
                <div class="piece-3d green"></div>
              </div>
              <div class="grid-3d-cell"></div>
              <div class="grid-3d-cell">
                <div class="piece-3d blue"></div>
              </div>
              <div class="grid-3d-cell"></div>
              <div class="grid-3d-cell">
                <div class="piece-3d green"></div>
              </div>
              <div class="grid-3d-cell"></div>
              <div class="grid-3d-cell">
                <div class="piece-3d blue"></div>
              </div>
              <div class="grid-3d-cell"></div>
              <div class="grid-3d-cell">
                <div class="piece-3d green"></div>
              </div>
            </div>
          </div>
          <span class="logo-word">SKATO</span>
          <span class="logo-tagline">Logika. Strategia. Elegancja.</span>
        </div>
        <div class="menu-buttons">
          <button id="play-button" class="btn-menu btn-menu--play" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
            <span>GRAJ</span>
          </button>
          <button id="play-online-button" class="btn-menu btn-menu--online" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="4" ry="9" />
              <path d="M3 12h18" />
            </svg>
            <span>GRAJ ONLINE</span>
          </button>
          <button id="settings-button" class="btn-menu btn-menu--settings" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="4" y1="7" x2="20" y2="7" /><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none" />
              <line x1="4" y1="14" x2="20" y2="14" /><circle cx="16" cy="14" r="2" fill="currentColor" stroke="none" />
              <line x1="4" y1="21" x2="20" y2="21" /><circle cx="11" cy="21" r="2" fill="currentColor" stroke="none" />
            </svg>
            <span>USTAWIENIA</span>
          </button>
        </div>
      </section>

      <section id="mode-screen" class="menu-screen hidden">
        <div class="menu-logo">
          <span class="logo-word">WYBIERZ TRYB</span>
        </div>
        <div class="menu-buttons">
          <button id="local-mode-button" class="btn-menu btn-menu--play" type="button">GRAJ SAM</button>
          <button id="bot-mode-button" class="btn-menu btn-menu--online" type="button">PRZECIWKO BOTOWI</button>
        </div>
      </section>

      <section id="bot-setup-screen" class="menu-screen hidden">
        <div class="menu-logo">
          <span class="logo-word">USTAWIENIA BOTA</span>
        </div>
        <div class="setup-block">
          <span class="setup-label">Poziom trudności</span>
          <div class="choice-group choice-group--stack" id="difficulty-group">
            <button class="btn-choice difficulty-card" data-difficulty="easy" type="button">
              <span class="difficulty-name">Łatwy</span>
              <span class="difficulty-dots">
                <i class="dot dot--on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
              </span>
            </button>
            <button class="btn-choice difficulty-card" data-difficulty="medium" type="button">
              <span class="difficulty-name">Średni</span>
              <span class="difficulty-dots">
                <i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
              </span>
            </button>
            <button class="btn-choice difficulty-card" data-difficulty="hard" type="button">
              <span class="difficulty-name">Trudny</span>
              <span class="difficulty-dots">
                <i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot"></i><i class="dot"></i>
              </span>
            </button>
            <button class="btn-choice difficulty-card" data-difficulty="expert" type="button">
              <span class="difficulty-name">Ekspert</span>
              <span class="difficulty-dots">
                <i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot"></i>
              </span>
            </button>
            <button class="btn-choice difficulty-card" data-difficulty="master" type="button">
              <span class="difficulty-name">Mistrz</span>
              <span class="difficulty-dots">
                <i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i><i class="dot dot--on"></i>
              </span>
            </button>
          </div>
        </div>
        <div class="setup-block">
          <span class="setup-label">Twój kolor</span>
          <div class="choice-group choice-group--row" id="color-group">
            <button class="btn-choice" data-color="green" type="button">Zielony</button>
            <button class="btn-choice" data-color="blue" type="button">Niebieski</button>
          </div>
        </div>
        <div class="menu-buttons">
          <button id="bot-start-button" class="btn-menu btn-menu--play" type="button">ROZPOCZNIJ</button>
          <button id="bot-back-button" class="btn-menu btn-menu--settings" type="button">WSTECZ</button>
        </div>
      </section>

      <section id="online-screen" class="menu-screen hidden">
        <div class="menu-logo">
          <span class="logo-word">GRAJ ONLINE</span>
        </div>
        <div class="menu-buttons">
          <button id="online-create-button" class="btn-menu btn-menu--play" type="button">STWÓRZ LOBBY</button>
          <button id="online-join-button" class="btn-menu btn-menu--online" type="button">DOŁĄCZ DO LOBBY</button>
          <button id="online-leaderboard-button" class="btn-menu btn-menu--settings" type="button">RANKING</button>
          <button id="online-back-button" class="btn-menu btn-menu--settings" type="button">WSTECZ</button>
        </div>
      </section>

      <section id="online-info-screen" class="menu-screen hidden">
        <div class="menu-logo">
          <span class="logo-word" id="online-info-title">LOBBY</span>
        </div>
        <p class="online-info-text" id="online-info-text"></p>
        <div class="menu-buttons">
          <button id="online-info-back-button" class="btn-menu btn-menu--settings" type="button">WSTECZ</button>
        </div>
      </section>

      <section id="settings-screen" class="menu-screen hidden">
        <div class="menu-logo">
          <span class="logo-word">USTAWIENIA</span>
        </div>
        <div class="setup-block">
          <span class="setup-label">Głośność</span>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70" />
        </div>
        <div class="menu-buttons">
          <button id="settings-back-button" class="btn-menu btn-menu--settings" type="button">WSTECZ</button>
        </div>
      </section>

      <section id="hud" class="hud hidden">
        <div class="hud-player hud-player--blue" id="hud-blue">
          <span class="player-chip player-chip--a"></span>
          <span class="player-score" id="score-blue">0</span>
        </div>
        <div class="hud-player hud-player--green" id="hud-green">
          <span class="player-chip player-chip--b"></span>
          <span class="player-score" id="score-green">0</span>
        </div>
      </section>

      <section id="result-screen" class="result-screen hidden">
        <div class="result-card">
          <span class="result-title" id="result-title">Koniec gry</span>
          <span class="result-reason" id="result-reason"></span>
          <span class="result-score" id="result-score">0 : 0</span>
          <button id="restart-button" class="btn-menu btn-menu--play" type="button">ZAGRAJ PONOWNIE</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
